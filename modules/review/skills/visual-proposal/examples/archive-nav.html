<!--
  Visual-proposal archive side menu.
  Paste into every proposal page. Fill window.VP_ARCHIVE from:

    bash scripts/list-proposals.sh --current <slug> [workspace-root ...]

  The browser cannot list docs/proposals/. The agent inlines that JSON here.
  A row with url (https, from data-vp-url after publishing) is a real link.
  A local row copies instructions for the agent to open that file.
-->
<style>
  .vp-shell{display:grid;grid-template-columns:min(16.5rem,32vw) 1fr;min-height:100vh}
  .vp-archive{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;
    padding:1.1rem .9rem 2rem;border-right:1px solid var(--vp-line,var(--line,#d9d4c6));
    background:color-mix(in srgb,var(--vp-raise,var(--raise,#fbf8f1)) 88%,transparent)}
  .vp-archive h2{margin:0 0 .7rem;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--vp-mut,var(--muted,#8a8172));font-weight:650}
  .vp-archive ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.2rem}
  .vp-archive a.vp-item,.vp-archive button.vp-item,.vp-archive .vp-item.is-current{
    display:block;width:100%;padding:.45rem .55rem;border-radius:8px;text-decoration:none;
    color:var(--vp-ink,var(--ink,#211c15));border:1px solid transparent;background:transparent;
    font:inherit;text-align:left;cursor:pointer;box-sizing:border-box}
  .vp-archive .vp-item.is-current{cursor:default}
  .vp-archive a.vp-item:hover,.vp-archive button.vp-item:hover{
    border-color:color-mix(in srgb,var(--vp-accent,var(--accent,#b8731a)) 40%,transparent)}
  .vp-archive a.vp-item:focus-visible,.vp-archive button.vp-item:focus-visible{
    outline:2px solid var(--vp-accent,var(--accent,#b8731a));outline-offset:2px}
  .vp-archive .vp-item[aria-current="page"],.vp-archive .vp-item.is-copied{
    border-color:var(--vp-accent,var(--accent,#b8731a));
    box-shadow:0 0 0 1px var(--vp-accent,var(--accent,#b8731a)) inset}
  .vp-archive .t{display:block;font-weight:620;line-height:1.3}
  .vp-archive .m{display:block;margin-top:.15rem;font-size:.75rem;color:var(--vp-mut,var(--muted,#8a8172))}
  .vp-help{display:inline-flex;align-items:center;justify-content:center;position:relative;
    width:1.05rem;height:1.05rem;margin-left:.2rem;vertical-align:middle;
    border-radius:99px;border:1px solid currentColor;font-size:.68rem;font-weight:700;
    line-height:1;cursor:help}
  .vp-tip{position:absolute;left:0;top:calc(100% + .4rem);width:13.5rem;padding:.5rem .6rem;
    border-radius:8px;background:var(--vp-ink,var(--ink,#211c15));
    color:var(--vp-raise,var(--raise,#fbf8f1));font-size:.75rem;font-weight:500;
    letter-spacing:0;text-transform:none;line-height:1.35;opacity:0;pointer-events:none;
    box-shadow:0 8px 24px color-mix(in srgb,#000 18%,transparent);z-index:5;
    transition:opacity .12s}
  .vp-help:hover .vp-tip,.vp-item.is-copied:hover .vp-help .vp-tip{opacity:1}
  .vp-archive .empty{font-size:.85rem;color:var(--vp-mut,var(--muted,#8a8172))}
  .vp-main{min-width:0}
  @media (max-width:820px){
    .vp-shell{grid-template-columns:1fr}
    .vp-archive{position:relative;max-height:none;border-right:0;border-bottom:1px solid var(--vp-line,var(--line,#d9d4c6))}
  }
</style>
<aside class="vp-archive" aria-label="Previous proposals">
  <h2>Proposals</h2>
  <ol id="vp-archive-list"></ol>
</aside>
<script>
window.VP_ARCHIVE = window.VP_ARCHIVE || [];
/* Agent: replace the array above with list-proposals.sh JSON, e.g.
window.VP_ARCHIVE = [
  {"slug":"ord-fs-json","title":"Referenced-content collections","project":"prompts","mtime":"2026-08-19","path":"/abs/docs/proposals/ord-fs-json.html","current":true},
  {"slug":"hosted","title":"Hosted draft","project":"prompts","mtime":"2026-08-20","path":"/abs/docs/proposals/hosted.html","url":"https://bitplan.dev/d/example","current":false}
];
*/
(function(){
  var list=document.getElementById('vp-archive-list');
  if(!list) return;
  var TIP='Paste the copied text into your agent. The agent then serves and opens the other proposal.';
  var rows=Array.isArray(window.VP_ARCHIVE)?window.VP_ARCHIVE:[];
  if(!rows.length){
    list.outerHTML='<p class="empty">No other files in docs/proposals/.</p>';
    return;
  }
  function hostedUrl(row){
    var u=row&&row.url;
    return (typeof u==='string' && u.slice(0,8)==='https://') ? u : '';
  }
  function meta(row){
    return [row.project,row.mtime].filter(Boolean).join(' · ');
  }
  function instructions(row){
    var title=row.title||row.slug||'this proposal';
    var path=row.path||'';
    return 'Show me the previous visual proposal.\n\nTitle: '+title+'\nPath: '+path+
      '\n\nOpen that HTML and show me the page. Use an Artifact when that tool exists. Otherwise load the installed BitPlan skill or open the file in the browser. Do not summarize the file.';
  }
  function fillLabel(el,row,copied){
    el.textContent='';
    var t=document.createElement('span'); t.className='t';
    if(copied){
      t.appendChild(document.createTextNode('Instructions copied '));
      var help=document.createElement('span'); help.className='vp-help';
      help.setAttribute('aria-hidden','true');
      help.appendChild(document.createTextNode('?'));
      var tip=document.createElement('span'); tip.className='vp-tip';
      tip.textContent=TIP;
      help.appendChild(tip);
      t.appendChild(help);
    } else {
      t.textContent=row.title||row.slug||'proposal';
    }
    el.appendChild(t);
    var m=document.createElement('span'); m.className='m';
    m.textContent=meta(row);
    if(m.textContent) el.appendChild(m);
  }
  function restoreCopied(){
    list.querySelectorAll('button.vp-item.is-copied').forEach(function(b){
      b.classList.remove('is-copied');
      b.removeAttribute('title');
      fillLabel(b,b._row,false);
    });
  }
  function copyText(text,done,fail){
    function fallback(){
      var ta=document.createElement('textarea');
      ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select();
      var ok=false;
      try{ok=document.execCommand('copy')}catch(e){}
      ta.remove();
      ok?done():fail();
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done,fallback);
    } else fallback();
  }
  rows.forEach(function(row){
    var li=document.createElement('li');
    var url=hostedUrl(row);
    var el;
    if(row.current){
      el=document.createElement('div');
      el.className='vp-item is-current';
      el.setAttribute('aria-current','page');
      fillLabel(el,row,false);
    } else if(url){
      el=document.createElement('a');
      el.className='vp-item';
      el.href=url;
      el.target='_blank';
      el.rel='noreferrer';
      fillLabel(el,row,false);
    } else {
      el=document.createElement('button');
      el.type='button';
      el.className='vp-item';
      el._row=row;
      fillLabel(el,row,false);
      el.addEventListener('click',function(){
        copyText(instructions(row),function(){
          restoreCopied();
          el.classList.add('is-copied');
          el.title=TIP;
          fillLabel(el,row,true);
        },function(){});
      });
    }
    li.appendChild(el); list.appendChild(li);
  });
})();
</script>
