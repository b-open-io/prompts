<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual coordinator — graph builder</title>
<!--
  Copy this file into the artifact. Replace window.VC_SEED with the graph
  for THIS job (nodes + edges). Do not leave the untitled Start/Work/Gate
  template on a real dispatch. The graph is the workflow; the inspector
  only staffs the selected card.
-->
<style>
  :root{
    --bg:#0b1020; --grid:rgba(140,170,220,.07); --ink:#eef2ff; --mut:#8b93ad;
    --line:#243049; --card:#151b2e; --source:#12182a;
    --rose:#3a1d2c; --rose-b:#c45b7a; --teal:#12363a; --teal-b:#3ec9b0;
    --purp:#2a1f4a; --purp-b:#8b7cf7; --mint:#3ee0a8; --gold:#c9a227; --warn:#e8b86d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14.5px/1.4 "Segoe UI",ui-sans-serif,system-ui,sans-serif}
  body{display:grid;grid-template-rows:auto auto 1fr;min-height:100vh}
  header, .tools{display:flex;align-items:center;gap:.7rem;padding:.55rem 1rem;
    border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,#000);flex-wrap:wrap}
  header h1{margin:0;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:650;color:var(--mut)}
  .banner{font-size:.85rem} .banner b{color:var(--teal-b)}
  header .sp,.tools .sp{flex:1}
  button,select,input,textarea{font:inherit;color:var(--ink)}
  button{cursor:pointer;background:#1a2340;border:1px solid var(--line);border-radius:8px;padding:.35rem .65rem}
  button.primary{background:var(--teal-b);color:#06231d;border:0;font-weight:700}
  button.danger{border-color:#8a3048;color:#f0b4c2}
  .ghost{background:transparent}
  input[type=text],input[type=number],select,textarea{background:#0c1222;border:1px solid var(--line);border-radius:8px;padding:.35rem .5rem}
  .name{width:16rem;flex:0 0 auto;background:transparent;border:1px dashed var(--line)}
  .legend{display:flex;gap:.9rem;font-size:.75rem;color:var(--mut)}
  .legend i{display:inline-block;width:1.3rem;border-top:2px solid var(--mint);vertical-align:middle;margin-right:.3rem}
  .legend i.dash{border-top-style:dashed;border-color:var(--purp-b)}
  .hintbar{font-size:.8rem;color:var(--mut);width:100%}
  main{display:grid;grid-template-columns:1fr min(22rem,36vw);min-height:0}
  .board{overflow:auto;min-width:0}
  .stage{position:relative;min-width:1240px;min-height:780px;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:32px 32px}
  .edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .edges path.hit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:pointer}
  .node{position:absolute;width:200px;padding:.7rem .85rem .7rem;border-radius:12px;
    border:1px solid var(--line);background:var(--card);cursor:grab;user-select:none}
  .node.source{background:var(--source)}
  .node.process{background:linear-gradient(180deg,#4a2434,var(--rose));border-color:var(--rose-b)}
  .node.gate{background:linear-gradient(180deg,#16464a,var(--teal));border-color:var(--teal-b)}
  .node.artifact,.node.memory{background:linear-gradient(180deg,#352866,var(--purp));border-color:var(--purp-b)}
  .node.shell{box-shadow:inset 0 0 0 1px var(--gold)}
  .node.is-on{box-shadow:0 0 0 2px var(--mint)}
  .node .k{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:650;margin:0 0 .2rem}
  .node h2{margin:0;font-size:.98rem}
  .node .sub{margin:.15rem 0 0;font-size:.78rem;color:color-mix(in srgb,var(--ink) 70%,var(--mut))}
  .chips{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.45rem;align-items:center}
  .chip{font-size:.66rem;padding:.1rem .38rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);background:rgba(0,0,0,.18)}
  .port{position:absolute;width:12px;height:12px;border-radius:99px;background:var(--mint);border:2px solid var(--bg);
    top:50%;margin-top:-6px;cursor:crosshair;z-index:2}
  .port.in{left:-7px} .port.out{right:-7px}
  .port.armed{box-shadow:0 0 0 4px color-mix(in srgb,var(--mint) 35%,transparent)}
  .group{position:absolute;border:1.5px dashed var(--gold);border-radius:14px;pointer-events:none}
  .group span{position:absolute;top:-.55rem;left:.8rem;background:var(--bg);color:var(--gold);
    font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:0 .35rem}
  .elab{position:absolute;font-size:.68rem;font-weight:650;color:var(--warn);white-space:nowrap;
    background:var(--bg);padding:0 .28rem;pointer-events:none;transform:translate(-50%,-110%)}
  aside{border-left:1px solid var(--line);padding:1rem .95rem;background:#101628;overflow:auto}
  aside h2{margin:0 0 .15rem;font-size:1.05rem}
  aside .who{font-size:.8rem;color:var(--mut);margin:0 0 .85rem}
  label{display:block;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:0 0 .25rem}
  .field{margin:0 0 .7rem}
  textarea{width:100%;min-height:4.6rem;resize:vertical}
  aside select, aside input[type=text]{width:100%}
  .empty{color:var(--mut)} .hint{font-size:.78rem;color:var(--mut);margin:.5rem 0 0}
  .row{display:flex;gap:.4rem;flex-wrap:wrap}
  .dials{display:flex;align-items:center;gap:.45rem;font-size:.8rem;color:var(--mut)}
  .dials select,.dials input{width:auto;min-width:7rem}
  .dials input[type=number]{width:4.2rem}
  .dials input[type=text]{width:8rem}
  .warns{list-style:none;margin:.2rem 0 0;padding:0;width:100%;font-size:.78rem;color:var(--warn)}
  .warns li{margin:.12rem 0}
  .chip.av{width:1.15rem;height:1.15rem;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:99px;font-size:.58rem;font-weight:700;overflow:hidden;border:0}
  .chip.av img{width:100%;height:100%;object-fit:cover;display:block}
  .fate{font-size:.8rem;color:var(--gold);margin:0 0 .75rem}
  .spec{width:100%;min-height:16rem;font:11px/1.35 ui-monospace,Menlo,monospace;white-space:pre}
  @media (max-width:820px){ main{grid-template-columns:1fr} aside{border-left:0;border-top:1px solid var(--line)} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<header>
  <h1>Visual coordinator</h1>
  <div class="banner">Host: <b id="host-name">Grok Build</b> — fixed</div>
  <input class="name" id="wf-name" type="text" value="untitled" aria-label="Workflow name">
  <div class="dials">
    <label for="isolation">Isolation</label>
    <select id="isolation" aria-label="Isolation">
      <option value="shared-tree">shared tree</option>
      <option value="worktree-per-agent">worktree per agent</option>
    </select>
    <label for="concurrency">Live children</label>
    <input id="concurrency" type="number" min="1" value="3" aria-label="Concurrency">
    <label for="cwd">cwd</label>
    <input id="cwd" type="text" value="." aria-label="Working directory">
  </div>
  <div class="legend"><span><i></i>forward</span><span><i class="dash"></i>reject / memory</span></div>
  <span class="sp"></span>
  <button type="button" class="primary" id="copy">Copy spec</button>
</header>
<div class="tools">
  <span class="hintbar">The chart is the workflow. Add nodes, then drag a mint port to another port. Drag a card to move it. Backspace deletes. Ctrl/Cmd+Z undoes.</span>
  <ul class="warns" id="warns"></ul>
  <span class="sp"></span>
  <button type="button" data-add="source">+ Source</button>
  <button type="button" data-add="process">+ Step</button>
  <button type="button" data-add="gate">+ Gate</button>
  <button type="button" data-add="artifact">+ Artifact</button>
  <button type="button" data-add="memory">+ Memory</button>
  <button type="button" class="ghost" id="arrange">Arrange</button>
  <button type="button" class="ghost" id="example">Load example</button>
  <button type="button" class="danger" id="del">Delete</button>
</div>
<main>
  <div class="board"><div class="stage" id="stage">
    <svg class="edges" id="svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arr-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#3ee0a8"/></marker>
        <marker id="arr-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8b7cf7"/></marker>
      </defs>
    </svg>
  </div></div>
  <aside id="inspector"><p class="empty">Select a node or an edge. Staffing lives here. Structure lives on the graph.</p></aside>
</main>
<script>
window.VC_ENV = window.VC_ENV || { harness: "grok" };
window.VC_SEED = window.VC_SEED || { name: "", nodes: [], edges: [] };
(function(){
  var ENV = window.VC_ENV || {};
  var MODELS = ENV.models || {
    grok:["grok-4.6"], grok_effort:["none","minimal","low","medium","high","xhigh"],
    claude:["fable","sonnet","opus"], claude_effort:["low","medium","high","xhigh","max"],
    codex:["gpt-5.6-sol"], codex_effort:["minimal","low","medium","high","xhigh"]
  };
  var LANES = ENV.lanes || { grok:"available", claude:"available", codex:"available" };
  var ROSTER = ENV.roster || ["","orchestra:coordinator","orchestra:agent-builder","review:tester"];
  var HARNESS = ENV.harness || "grok";
  var AVATAR_HUE = ["#3ec9b0","#8b7cf7","#c45b7a","#c9a227","#6ea8ff","#e38f1a"];
  var nid = 1, eid = 1, inspectorFor = null;
  var S = { name:"untitled", isolation:"shared-tree", concurrency:3, cwd: ENV.cwd || ".", nodes:[], edges:[] };
  var sel = null;
  var drag = null, link = null;
  var hist = [], hpos = -1;

  function uid(p){ return p + (p==="n"? nid++ : eid++); }
  function node(o){ return Object.assign({ id:uid("n"), kind:"process", x:80, y:160, label:"Step", detail:"", lane:hostLane(), model:(modelsFor(hostLane())[0]||"grok-4.6"), effort:"medium", agentType:"", task:"", gateCmd:"", schema:"", paths:"", command:"" }, o); }
  function edge(o){ return Object.assign({ id:uid("e"), from:"", to:"", label:"", kind:"forward" }, o); }
  function hostLane(){
    if(HARNESS==="claude-code") return "claude";
    if(HARNESS==="codex") return "codex";
    return "grok";
  }
  function staffed(n){ return n.kind==="process" || n.kind==="gate"; }
  function isShell(n){ return staffed(n) && n.lane && n.lane !== hostLane(); }
  function cap(){
    if(ENV.caps && ENV.caps.live_children) return ENV.caps.live_children;
    if(HARNESS==="claude-code") return 16;
    if(HARNESS==="grok") return 32;
    return 6;
  }
  function modelsFor(lane){
    return (MODELS[lane]||[]).filter(function(m){ return m && m!=="unknown" && m!=="grok-4.5"; });
  }
  function effortsFor(lane){
    return (MODELS[lane+"_effort"]||["low","medium","high"]).filter(function(m){ return m && m!=="unknown"; });
  }
  function laneAvailable(lane){ return LANES[lane] !== "unavailable"; }
  function rosterList(){
    var src=Array.isArray(ROSTER)?ROSTER:[];
    var out=[{id:"", name:"(none)", avatar:""}];
    src.forEach(function(r){
      if(!r) return;
      if(typeof r==="string"){ out.push({id:r, name:r, avatar:""}); return; }
      if(r.id) out.push({id:r.id, name:r.display_name||r.name||r.id, avatar:r.avatar||""});
    });
    return out;
  }
  function rosterWho(id){ return rosterList().find(function(r){ return r.id && r.id===id; }); }
  function inboundForward(id){
    return S.edges.filter(function(e){ return e.to===id && e.kind==="forward"; }).length;
  }
  function hash(s){
    var h=0, i; s=String(s||"");
    for(i=0;i<s.length;i++) h=((h<<5)-h)+s.charCodeAt(i)|0;
    return Math.abs(h);
  }
  function initials(name){
    var parts=String(name||"").trim().split(/[\s:_-]+/).filter(Boolean);
    if(!parts.length) return "?";
    if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
  }
  function avatarChip(n){
    var who=rosterWho(n.agentType); if(!who) return "";
    if(who.avatar) return '<span class="chip av"><img alt="" src="'+esc(who.avatar)+'"></span>';
    var hue=AVATAR_HUE[hash(who.id)%AVATAR_HUE.length];
    return '<span class="chip av" style="background:'+hue+';color:#06231d">'+esc(initials(who.name))+"</span>";
  }

  function seedMinimal(){
    nid=1; eid=1;
    var native=hostLane();
    var nativeModel=modelsFor(native)[0]||"grok-4.6";
    var gateLane=modelsFor("claude").length && laneAvailable("claude") ? "claude" : native;
    var gateModel=gateLane==="claude" && modelsFor("claude").indexOf("fable")>=0 ? "fable" : (modelsFor(gateLane)[0]||nativeModel);
    S.name = "untitled";
    S.nodes = [
      node({id:"n1", kind:"source", x:36, y:188, label:"Start", detail:"brief in"}),
      node({id:"n2", kind:"process", x:280, y:178, label:"Work", detail:"do the job", lane:native, model:nativeModel, effort:"medium"}),
      node({id:"n3", kind:"gate", x:530, y:178, label:"Gate", detail:"prove it", lane:gateLane, model:gateModel, effort:"high", gateCmd:"bun test"}),
      node({id:"n4", kind:"process", x:780, y:178, label:"Done", detail:"ship or complete", lane:native, model:nativeModel, effort:"low"})
    ];
    nid=5;
    S.edges = [
      edge({id:"e1", from:"n1", to:"n2", label:"brief", kind:"forward"}),
      edge({id:"e2", from:"n2", to:"n3", label:"result", kind:"forward"}),
      edge({id:"e3", from:"n3", to:"n4", label:"pass", kind:"forward"}),
      edge({id:"e4", from:"n3", to:"n2", label:"fail · retry", kind:"reject"})
    ];
    eid=5;
    document.getElementById("wf-name").value = S.name;
    syncDials();
  }
  function seedExample(){
    nid=1; eid=1;
    S.name = "maker-checker-factory";
    S.nodes = [
      node({id:"n1", kind:"source", x:36, y:188, label:"Intake", detail:"user brief and repo"}),
      node({id:"n2", kind:"process", x:268, y:178, label:"Decompose", detail:"owned paths", lane:"grok", model:"grok-4.6", effort:"high", agentType:"orchestra:coordinator"}),
      node({id:"n3", kind:"process", x:508, y:36, label:"Implement A", detail:"tests", lane:"grok", model:"grok-4.6", effort:"low"}),
      node({id:"n4", kind:"process", x:508, y:178, label:"Implement B", detail:"pages", lane:"codex", model:"gpt-5.6-sol", effort:"medium"}),
      node({id:"n5", kind:"process", x:508, y:320, label:"Implement C", detail:"API", lane:"grok", model:"grok-4.6", effort:"low"}),
      node({id:"n6", kind:"gate", x:748, y:178, label:"Verify", detail:"checker + bun test", lane:"claude", model:"fable", effort:"high", gateCmd:"bun test"}),
      node({id:"n7", kind:"process", x:988, y:178, label:"Ship", detail:"git stays here", lane:"grok", model:"grok-4.6", effort:"medium", agentType:"orchestra:coordinator"}),
      node({id:"n8", kind:"artifact", x:988, y:36, label:"Diff", detail:"what workers wrote"}),
      node({id:"n9", kind:"artifact", x:988, y:320, label:"Gate log", detail:"pass or findings"}),
      node({id:"n10", kind:"memory", x:60, y:580, label:"Last run journal", detail:"previous findings"})
    ];
    nid=11;
    S.edges = [
      edge({id:"e1", from:"n1", to:"n2", label:"brief", kind:"forward"}),
      edge({id:"e2", from:"n2", to:"n3", label:"", kind:"forward"}),
      edge({id:"e3", from:"n2", to:"n4", label:"specs", kind:"forward"}),
      edge({id:"e4", from:"n2", to:"n5", label:"", kind:"forward"}),
      edge({id:"e5", from:"n3", to:"n6", label:"", kind:"forward"}),
      edge({id:"e6", from:"n4", to:"n6", label:"diffs · barrier", kind:"forward"}),
      edge({id:"e7", from:"n5", to:"n6", label:"", kind:"forward"}),
      edge({id:"e8", from:"n6", to:"n7", label:"pass", kind:"forward"}),
      edge({id:"e9", from:"n7", to:"n8", label:"", kind:"forward"}),
      edge({id:"e10", from:"n7", to:"n9", label:"", kind:"forward"}),
      edge({id:"e11", from:"n6", to:"n4", label:"fail · max 2 retries", kind:"reject"}),
      edge({id:"e12", from:"n7", to:"n10", label:"carried forward", kind:"memory"}),
      edge({id:"e13", from:"n10", to:"n2", label:"last run", kind:"memory"})
    ];
    eid=14;
    document.getElementById("wf-name").value = S.name;
    syncDials();
  }
  function syncDials(){
    var iso=document.getElementById("isolation"); if(iso) iso.value=S.isolation||"shared-tree";
    var cEl=document.getElementById("concurrency");
    if(cEl){ cEl.max=String(cap()); cEl.value=String(S.concurrency||3); }
    var cwd=document.getElementById("cwd"); if(cwd) cwd.value=S.cwd||".";
  }

  var stage = document.getElementById("stage");
  var svg = document.getElementById("svg");
  var aside = document.getElementById("inspector");

  function byId(id){ return S.nodes.find(function(n){ return n.id===id; }); }
  function eById(id){ return S.edges.find(function(e){ return e.id===id; }); }

  function chips(n){
    var av=staffed(n)?avatarChip(n):"";
    if (!staffed(n)) return av+(inboundForward(n.id)>=2 ? '<span class="chip">barrier</span>' : "");
    var who=rosterWho(n.agentType);
    var bits = [n.lane, n.model, n.effort, who && who.name, isShell(n) && "CLI", n.kind==="gate" && n.gateCmd, inboundForward(n.id)>=2 && "barrier"];
    return av+bits.filter(Boolean).map(function(b){ return '<span class="chip">'+esc(b)+"</span>"; }).join("");
  }
  function kindLabel(n){
    if (n.kind==="gate") return "gate node";
    if (n.kind==="source") return "source";
    if (n.kind==="artifact") return "artifact";
    if (n.kind==="memory") return "memory";
    return isShell(n) ? "CLI shell-out" : "native";
  }
  function esc(s){ return String(s||"").replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]; }); }

  function paintNodes(){
    stage.querySelectorAll(".node,.group").forEach(function(el){ el.remove(); });
    var mem = S.nodes.filter(function(n){ return n.kind==="memory"; });
    if (mem.length){
      var pad=18, x1=Infinity,y1=Infinity,x2=0,y2=0;
      mem.forEach(function(n){ x1=Math.min(x1,n.x); y1=Math.min(y1,n.y); x2=Math.max(x2,n.x+200); y2=Math.max(y2,n.y+110); });
      var g=document.createElement("div"); g.className="group";
      g.style.left=(x1-pad)+"px"; g.style.top=(y1-28)+"px";
      g.style.width=(x2-x1+pad*2)+"px"; g.style.height=(y2-y1+pad+28)+"px";
      g.innerHTML="<span>Across runs</span>";
      stage.appendChild(g);
    }
    S.nodes.forEach(function(n){
      var el=document.createElement("article");
      el.className="node "+n.kind+(isShell(n)?" shell":"")+(sel&&sel.k==="node"&&sel.id===n.id?" is-on":"");
      el.id=n.id; el.style.left=n.x+"px"; el.style.top=n.y+"px";
      el.innerHTML='<div class="k">'+esc(kindLabel(n))+'</div><h2>'+esc(n.label)+'</h2>'+
        (n.detail?'<div class="sub">'+esc(n.detail)+"</div>":"")+
        '<div class="chips">'+chips(n)+"</div>"+
        '<span class="port in" data-port="in" data-id="'+n.id+'"></span>'+
        '<span class="port out" data-port="out" data-id="'+n.id+'"></span>';
      stage.appendChild(el);
    });
    sizeStage();
  }
  function sizeStage(){
    var maxX=1240, maxY=780;
    S.nodes.forEach(function(n){ maxX=Math.max(maxX,n.x+280); maxY=Math.max(maxY,n.y+200); });
    stage.style.width=maxX+"px"; stage.style.height=maxY+"px";
  }
  function port(id, side){
    var n=byId(id); if(!n) return {x:0,y:0};
    var el=document.getElementById(id);
    var s=stage.getBoundingClientRect(), r=el.getBoundingClientRect();
    var x=r.left-s.left, y=r.top-s.top, w=r.width, h=r.height;
    if(side==="left") return {x:x, y:y+h/2};
    if(side==="right") return {x:x+w, y:y+h/2};
    if(side==="top") return {x:x+w/2, y:y};
    return {x:x+w/2, y:y+h};
  }
  function floorY(kind){
    var m=0; S.nodes.forEach(function(n){ m=Math.max(m, n.y+120); });
    return m + (kind==="memory"?48:24);
  }
  function pathFor(e){
    var p=port(e.from,"right"), q=port(e.to,"left");
    if(e.kind==="reject"){
      p=port(e.from,"bottom"); q=port(e.to,"left");
      var y=floorY("reject"), rail=q.x-18;
      return "M "+p.x+" "+p.y+" L "+p.x+" "+y+" L "+rail+" "+y+" L "+rail+" "+q.y+" L "+q.x+" "+q.y;
    }
    if(e.kind==="memory"){
      p=port(e.from,"bottom"); q=port(e.to,"right");
      var y2=floorY("memory"), rail=Math.min(p.x,q.x)-10;
      if (q.x > p.x) { p=port(e.from,"left"); rail=p.x-18; q=port(e.to,"right");
        return "M "+p.x+" "+p.y+" L "+rail+" "+p.y+" L "+rail+" "+y2+" L "+q.x+" "+y2+" L "+q.x+" "+q.y; }
      return "M "+p.x+" "+p.y+" L "+p.x+" "+y2+" L "+q.x+" "+y2+" L "+q.x+" "+q.y;
    }
    if(Math.abs(p.y-q.y)<6) return "M "+p.x+" "+p.y+" L "+q.x+" "+q.y;
    var mx=p.x+16;

  function delSel(){

  function connect(from,to, skipSelect){
    if(from===to) return;
    if(S.edges.some(function(e){ return e.from===from && e.to===to; })) return;
    var a=byId(from), b=byId(to);
    var kind="forward", label="";
    if((a && a.kind==="memory") || (b && b.kind==="memory")) kind="memory";
    else if(a && a.kind==="gate"){
      var hasPass=S.edges.some(function(e){ return e.from===from && e.kind==="forward"; });
      var toFeedsGate=S.edges.some(function(e){ return e.to===from && e.from===to && e.kind==="forward"; });
      if(hasPass && toFeedsGate){ kind="reject"; label="fail · retry"; }

  function arrange(){
    var fwd=S.edges.filter(function(e){ return e.kind==="forward"; });
    var indeg={}; S.nodes.forEach(function(n){ indeg[n.id]=0; });
    fwd.forEach(function(e){ if(indeg[e.to]!=null) indeg[e.to]++; });
    var layer={}, q=S.nodes.filter(function(n){ return indeg[n.id]===0; }).map(function(n){ return n.id; });
    q.forEach(function(id){ layer[id]=0; });
    var seen=Object.assign({},layer), qi=0;
    while(qi<q.length){
      var id=q[qi++];
      fwd.forEach(function(e){ if(e.from!==id) return; var L=(layer[id]||0)+1; if(layer[e.to]==null||L>layer[e.to]) layer[e.to]=L; if(!seen[e.to]){ seen[e.to]=1; q.push(e.to); } });
    }
    var cols={};
    S.nodes.forEach(function(n){ var L=layer[n.id]||0; (cols[L]=cols[L]||[]).push(n); });
    Object.keys(cols).forEach(function(L){
      cols[L].forEach(function(n,i){ n.x=36+Number(L)*244; n.y=36+i*150; });
    });
    draw();
    snap();
  }

  function composeCommand(n){
    if(n.command) return n.command;
    var dir=S.cwd || ".";
    var task=(n.task||n.label||"task").replace(/"/g,'\\"');
    var effort="";
    if(n.effort && n.lane==="codex") effort=' -c model_reasoning_effort="'+n.effort+'"';
    if(n.effort && n.lane==="grok") effort=" --reasoning-effort "+n.effort;
    if(n.lane==="codex") return 'codex exec --sandbox workspace-write --cd "'+dir+'" -m "'+n.model+'"'+effort+' "'+task+'"';
    if(n.lane==="grok") return 'grok --single "'+task+'" -m "'+n.model+'"'+effort+' --permission-mode acceptEdits --sandbox workspace --cwd "'+dir+'"';
    if(n.lane==="claude") return 'claude --print --safe-mode --append-system-prompt-file "$HOME/.claude/communication.md" --model "'+n.model+'" --permission-mode plan --tools "Read,Grep,Glob" --no-session-persistence "'+task+'"';
    return "";
  }
  function resolved(n){
    var row={
      id:n.id, kind:n.kind, label:n.label, detail:n.detail, x:n.x, y:n.y,
      lane:n.lane||null, model:n.model||null, effort:n.effort||null,
      task:n.task||"", paths:n.paths||null, gateCmd:n.kind==="gate"?n.gateCmd:null,
      shell:false, agentType:null, schema:null, command:null, converted:false, omit:false, omitReason:null
    };
    if(!staffed(n)) return row;
    if(!laneAvailable(n.lane) && isShell(n)){
      row.omit=true; row.omitReason="the "+n.lane+" CLI is not installed";
      row.shell=true; return row;
    }
    if(isShell(n)){
      row.shell=true; row.command=composeCommand(n); return row;
    }
    if(HARNESS==="grok" && n.model && n.model!=="grok-4.6"){
      var lane=null;
      if(modelsFor("grok").indexOf(n.model)>=0) lane="grok";
      else if(modelsFor("codex").indexOf(n.model)>=0) lane="codex";
      else if(modelsFor("claude").indexOf(n.model)>=0) lane="claude";
      if(!lane){
        row.omit=true; row.omitReason=n.model+" is not on any detected lane";
        return row;
      }
      var remapped=Object.assign({}, n, {lane:lane});
      row.shell=true; row.converted=true; row.lane=lane;

    row.schema=n.schema||null;

  function isolationOut(){

  function warnings(){
    var out=[], c=cap();
    if(Number(S.concurrency)>c) out.push("Concurrency "+S.concurrency+" exceeds the "+HARNESS+" cap of "+c+"; "+c+" will be emitted.");
    if(HARNESS==="codex" && S.isolation==="worktree-per-agent")
      out.push("Codex has no worktree isolation; shared-tree will be emitted.");
    S.nodes.forEach(function(n){
      if(!staffed(n)) return;
      var ms=modelsFor(n.lane);
      if(n.model && ms.length && ms.indexOf(n.model)<0) out.push(n.label+": "+n.model+" is not on the "+n.lane+" lane.");
      if(isShell(n) && !laneAvailable(n.lane)) out.push(n.label+": the "+n.lane+" CLI is not installed, so this shell-out cannot run here.");
      if(HARNESS==="grok" && !isShell(n) && n.model && n.model!=="grok-4.6")
        out.push(n.label+": Grok agent().model accepts grok-4.6 only; "+n.model+" will emit as a shell-out.");
      if(n.schema && isShell(n)) out.push(n.label+": structured output is native-only; schema will not be emitted.");
      if(n.agentType && isShell(n)) out.push(n.label+": roster agentType is native-only; it will not be emitted.");
    });
    if(!S.nodes.some(function(n){ return n.kind==="gate"; }))
      out.push("No gate node. Add a Gate so fail can return to an earlier step.");

  function whoLine(n, r){
    var who=rosterWho(n.agentType);

      return "- **"+n.label+"** — SHELL-OUT to "+r.lane+(r.converted?" (converted from native)":"")+"\n"+
        "  model: "+(r.model||"")+" · effort: "+(r.effort||"tool default")+"\n"+

  function emit(){

    var c=Math.min(Number(S.concurrency)||cap(), cap());
    var iso=isolationOut();
    var resolvedNodes=S.nodes.map(resolved);
    var proto={
      version: 2,
      harness:HARNESS,
      name:S.name,
      isolation:iso,
      concurrency:c,
      cwd:S.cwd||".",
      nodes:resolvedNodes,
      edges:S.edges.map(function(e){ return { id:e.id, from:e.from, to:e.to, label:e.label, kind:e.kind }; }),
      gateNode: (S.nodes.find(function(n){ return n.kind==="gate"; })||{}).id || null
    };
    var lines=["# Workflow: "+S.name,"Host harness: "+HARNESS+"   (fixed — set by how this session started)",
      "Isolation: "+iso,"Concurrency: "+c,"cwd: "+(S.cwd||".")];
    if(HARNESS==="codex") lines.push("Codex has no workflow runtime. The forward path becomes ordered `codex exec` calls the caller sequences.");
    lines.push("","## Graph");
    S.edges.forEach(function(e){
      var a=byId(e.from), b=byId(e.to);

  function snap(){

    function fallback(){
      var box=document.createElement("textarea"); box.value=t; box.setAttribute("readonly","");
      box.style.position="fixed"; box.style.left="-9999px"; document.body.appendChild(box); box.select();
      try{ document.execCommand("copy"); }catch(err){}
      box.remove(); done();
    }
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback);
    else fallback();
  });
  document.getElementById("isolation").addEventListener("change", function(){ S.isolation=this.value; inspectorFor=null; snap(); draw(); });
  document.getElementById("concurrency").addEventListener("input", function(){ S.concurrency=Number(this.value)||1; inspectorFor=null; draw(); });
  document.getElementById("concurrency").addEventListener("change", snap);
  document.getElementById("cwd").addEventListener("input", function(){ S.cwd=this.value||"."; inspectorFor=null; draw(); });
  document.getElementById("cwd").addEventListener("change", snap);

  function adoptSeed(seed){
    S.name = seed.name || "untitled";
    S.isolation = seed.isolation || "shared-tree";
    S.concurrency = seed.concurrency || 3;
    S.cwd = seed.cwd || ENV.cwd || ".";
    S.nodes = (seed.nodes || []).map(function(n){ return Object.assign({}, n); });
    S.edges = (seed.edges || []).map(function(e){ return Object.assign({}, e); });
    function maxNum(list){
      var m=0;
      list.forEach(function(item){ var k=parseInt(String(item.id).replace(/\D/g,""),10); if(k>m) m=k; });
      return m;
    }
    nid = maxNum(S.nodes)+1;
    eid = maxNum(S.edges)+1;
    document.getElementById("wf-name").value = S.name;
    syncDials();
  }
  var hostEl=document.getElementById("host-name");
  if(hostEl) hostEl.textContent = HARNESS==="claude-code"?"Claude Code": HARNESS==="codex"?"Codex":"Grok Build";
  if (window.VC_SEED && VC_SEED.nodes && VC_SEED.nodes.length) adoptSeed(VC_SEED);
  else seedMinimal();
  draw();
  snap();
  window.VC = { emit:emit, getState:function(){ return S; } };
})();
</script>
</body>
</html>
