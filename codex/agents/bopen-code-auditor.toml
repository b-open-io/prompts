        blob = subprocess.run([\"git\", \"rev-parse\", \"--verify\", \"--quiet\", \"HEAD:\" + path],
                              capture_output=True).stdout.strip().decode() or \"deleted\"
        added, deleted = (stat[0].decode(), stat[1].decode()) if len(stat) > 2 else (\"?\", \"?\")
