## Vulnerability Scanning Workflow

`Skill(codex-security)` drives `@openai/codex-security` — an agentic scanner
that validates each candidate against the code, traces it source to sink, and
calibrates severity. It is part of a standard sweep, not a last resort: any time
the question is \"is there a real vulnerability in here\", it is the tool that
answers it. Reach for it on a security review of a repo or PR, before a release
touching auth/payments/key handling, and whenever a pattern sweep comes back
clean on code you don't yet trust.

Order the sweep by cost, and run all of it — the cheap passes are not a gate on
the expensive one, they just come first because they finish first:

1. `Skill(code-audit-scripts)`, `bun audit` — secrets, debug artifacts, known
   CVEs. Free, seconds.
2. `Skill(semgrep)`, `Skill(codeql)` — rule-expressible patterns and taint flows.
   Free, minutes.
3. `Skill(codex-security)` — reachable logic flaws no rule can express: authz
   gaps, IDOR, business-logic bypasses. Paid, minutes to hours.

```bash
# Scope tightly — cost tracks scope, and a scoped scan is a sharper scan
npx @openai/codex-security scan . --diff origin/main --max-cost 3   # a PR
npx @openai/codex-security scan . --path src/auth --max-cost 3      # a subsystem
```

Then close the loop rather than handing over a list. Findings come with attack
paths and occurrence IDs; the scanner also validates a single finding, patches
it, and proves closure by re-scan:

```bash
npx @openai/codex-security validate FINDINGS_JSON \"Missing authz in src/routes.ts:18\"
npx @openai/codex-security patch    FINDINGS_JSON \"Missing authz in src/routes.ts:18\"
npx @openai/codex-security scans compare \"$BEFORE_ID\" \"$AFTER_ID\"
npx @openai/codex-security findings false-positive OCC_ID --reason \"...\"
```

Three things decide whether the result is trustworthy, and all three are yours
to enforce:

- **Read `coverage.json` before calling anything clear.** An incomplete scan is
  not a clean scan. Exit 2 means incomplete coverage or a runtime error — never
  a pass.
- **`scans compare` reports unknown as well as resolved.** Unknown means the
  location wasn't reviewed. Report it beside the resolved count or the trend
  line lies.
- **Review every patch before it lands.** A minimal boundary repair is the
  scanner's objective, not a substitute for reading the diff.

Say up front that source contents go to OpenAI, confirm the repo is one the user
owns or is authorized to assess, and pass `--max-cost` every time — the scanner
runs with your filesystem permissions under `approvalPolicy: \"never\"` and never
stops to ask. `Skill(codex-security)` carries the preflight script, the full
command surface, the exit-code contract, and the CI wiring.

## Vercel Security Dashboard Workflow

Use Vercel's Security Dashboard for the deployed platform posture of a team and
its projects. It complements code scanners: it checks members, access tokens,
projects, deployments, and environment variables, while Jerry audits source
behavior and reachable code vulnerabilities. `vercel security check` is a
read-only reporting command: it identifies findings but does not apply fixes.

### Scan safely

1. Confirm the intended Vercel team and project scope before scanning. Start
   narrow when the user names a project:

   ```bash
   vercel security check --scope <TEAM_SLUG> --project <NAME_OR_ID> --findings
   ```

   Use `vercel security check --scope <TEAM_SLUG> --findings` only when a
   team-wide sweep is in scope. Pass an individual check slug to deep-dive one
   check. For automation, request structured output explicitly:

   ```bash
   vercel security check --scope <TEAM_SLUG> --project <NAME_OR_ID> \\
     --json --limit 1 --non-interactive --no-color
   ```

2. Treat the report as sensitive. Even `--limit 1` returns sample identities;
   it only minimizes them. The report can identify members, tokens, projects,
   deployments, and environment-variable metadata. Keep raw JSON in protected
   job artifacts, a protected pipe, or temporary local storage; summarize
   findings without copying secrets or sensitive identifiers into shared or
   public logs.
3. Classify every High and Medium finding, plus every `no access` or data
   unavailable result. Insufficient permission is unknown coverage, never a
   pass. A finding does not make the CLI fail: `vercel security check` exits 0
   even when checks have findings, so do not use the process status as evidence
   that the posture is clear.

### Interpret the real report

Interactive output supplies risk, status, violation count, and muted count.
Vercel CLI 59.5.0 machine output uses `.report`, keyed by check slug. Each value
has `violationsCount`, `sampleType`, and `samples`; some also have `totalCount`
and `truncated`. Do not assume risk, status, or muted state exists in JSON when
the field is absent. `totalCount` is the inspected population, not the number of
violations. When `truncated` is true, treat the displayed violation count as a
lower bound such as `100+`, never an exact count.

The current catalog and documented risk mapping are:

| Check slug | Risk | Control |
|---|---|---|
| `members-no-mfa` | High | Team members without MFA |
| `members-too-many-owners` | High | Team owner concentration above the recommended threshold |
| `pats-no-expiration` | High | Personal access tokens without expiration |
| `env-vars-creds-instead-of-oidc` | High | Static credentials where OIDC is available |
| `depl-no-git-fork-protection` | High | Projects without Git fork deploy prevention |
| `proj-no-preview-depl-protection` | High | Public preview deployments |
| `env-vars-non-sensitive` | Medium | Environment variables not marked Sensitive |
| `env-vars-non-sensitive-stale` | Medium | Environment variables older than 90 days |
| `env-vars-exposed-web-app-fwk` | Medium | Framework-exposed environment variables |

Fail closed on an unknown slug or schema change and re-check the live reference
instead of silently assigning a risk. A missing `muted` field does not mean a
finding is unmuted; use an output surface that actually exposes mute state when
the policy depends on it.

### Triage and remediate

Prioritize High findings before Medium findings. The check command only
reports; remediation happens through the linked Vercel settings or another
authorized Vercel interface, followed by a re-check.

For each finding, record the check slug, risk, affected entity, owner, proposed
change, and verification plan. Get explicit authorization before changing team
roles, enforcing MFA, revoking or replacing tokens, rotating secrets, enabling
deployment protection, or changing production authentication. Root owns the
Vercel and CI implementation; Jerry reviews repository code or configuration
changes that the remediation requires.

Marking an existing environment variable Sensitive does not erase its prior
readability: rotate the value as part of that fix. Prefer OIDC short-lived
credentials over static credentials where Vercel supports federation.

Do not mute a check or finding on your own. Muting is a recorded risk-acceptance
decision, excludes the item from the security score, and requires team-management
permission. Show the exact finding and rationale, obtain the user's approval,
and record who accepted the risk, why, and when.

### Prove closure

After authorized remediation, run the same scoped command and compare by check
slug and affected entity. Report resolved, remaining, muted, and unavailable
findings separately. Preserve `truncated` as `100+` or another lower-bound
notation across comparisons. Timestamp every snapshot and record the exact team
and project scope. Findings can change because another operator or an asynchronous
dashboard refresh ran between scans; correlate the change with the authorized
action or audit log before claiming your remediation caused it. \"All clear\"
requires zero unmuted High/Medium findings and no untriaged unavailable coverage
in the agreed scope. The UI path is Team Settings → Security & Privacy →
Security Dashboard; it can export CSV for triage or evidence when the user
requests it.

Source of truth: `https://vercel.com/docs/cli/security`. Re-check the live
reference before changing automation because CLI flags and the check catalog
can evolve.

## Dependency Scanning Workflow

```bash
# 1. Audit known CVEs
bun audit
# or if bun audit unavailable:
npm audit --json | jq '.vulnerabilities | to_entries[] | select(.value.severity == \"high\" or .value.severity == \"critical\")'

# 2. Check for outdated packages with known vulnerabilities
bun outdated

# 3. License compliance scan
npx license-checker --summary --onlyAllow \"MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0\"

# 4. SBOM generation
npx @cyclonedx/cyclonedx-npm --output-file sbom.json

# 5. Supply chain risk — flag typosquatting candidates and unmaintained packages
# Look for: packages with <100 downloads/week, recently transferred maintainership,
# packages with names similar to popular packages (e.g., \"lodahs\" vs \"lodash\")
```

**Supply chain risk signals to investigate:**
- Packages with very recent maintainer changes
- Packages with names one character away from well-known packages
- Packages with install scripts (`preinstall`, `postinstall`) that make network calls
- Packages with no public repository or locked-down issue trackers
- Transitive dependencies not pinned to exact versions in the lock file

## Secrets Scanning Workflow

```bash
# 1. Scan source code for credential patterns
grep -rn \\
  --exclude-dir=node_modules \\
  --exclude-dir=.git \\
  --exclude-dir=dist \\
  --include=\"*.ts\" --include=\"*.js\" --include=\"*.env*\" --include=\"*.json\" \\
  -E \"(api_key|apikey|api-key|secret|password|token|private_key|access_key)\\s*[=:]\\s*['\\\"][^'\\\"]{8,}\" .

# 2. Audit .env files
find . -name \".env*\" -not -path \"*/node_modules/*\" | xargs ls -la
# Confirm no .env files are committed to git
git ls-files | grep -E \"^\\.env\"

# 3. Git history scan for leaked secrets
git log --all -p -- \"*.env\" \"*.key\" | grep -i -E \"(password|secret|api_key|token|private)\" | head -50
git log --all --full-history -- .env .env.local .env.production

# 4. Check for hardcoded IPs or internal endpoints
grep -rn --exclude-dir=node_modules -E \"https?://[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\" .

# 5. Verify environment variables are set on deployed services (not hardcoded)
# Review vercel.json, railway.json, or CI config for plaintext secrets
grep -rn --include=\"*.json\" --include=\"*.yml\" --include=\"*.yaml\" \\
  -E \"(ANTHROPIC_API_KEY|OPENAI_API_KEY|DATABASE_URL|REDIS_URL)\" . | grep -v \".env.example\"
```

**Patterns that always require a Code Red:**
- Any private key material (WIF, PEM, hex private key)
- Live API keys for production services committed to version control
- Secrets in CI/CD config files that are checked in
- .env files tracked by git

**Secure Enclave awareness:** On macOS arm64, BAP CLI (`bap touchid enable`) and ClawNet CLI (`clawnet setup-key`, `clawnet login`) can protect keys/tokens with the Secure Enclave via `@1sat/vault`. When SE protection is enabled, plaintext key material is removed from disk — verify with `bap touchid status`. For CI/headless, use `BAP_NO_TOUCHID=1` or env vars (`SIGMA_MEMBER_PRIVATE_KEY`, `CLAWNET_TOKEN`). The `~/.secure-enclave-vault/` directory contains only SE-encrypted blobs, not plaintext secrets.

## Incident Response Playbook

When a potential security incident is reported, execute this five-step playbook:

### Step 1: Triage
- Identify the type of incident (leaked secret, compromised dependency, unauthorized access, data exposure)
- Assess severity: what systems are affected, what data is at risk
- Determine when the exposure started (git blame, log analysis)
- Assign blast radius: internal only, customer data, production systems, financial systems

### Step 2: Contain
- Rotate any compromised credentials immediately — do not wait for investigation to complete
- Disable affected endpoints if they pose ongoing risk
- Revoke access tokens for any service where exposure occurred
- If a package is compromised, pin to last known good version or remove

```bash
# Rotate Vercel environment variable
vercel env rm COMPROMISED_KEY production
vercel env add COMPROMISED_KEY production  # with new value

# Check for active sessions using compromised credentials
# Review Railway/Vercel deployment logs for anomalous access patterns
```

### Step 3: Investigate
- Pull audit logs from affected services (Vercel, Railway, GitHub)
- Trace all API calls made with compromised credentials during exposure window
- Identify whether any data was exfiltrated or modified
- Document the full timeline with timestamps

```bash
# Git history investigation
git log --all --since=\"2 weeks ago\" --author-date-order --format=\"%H %ai %an %s\" | head -50
git log --all -p --follow -- path/to/suspicious/file

# Check for unexpected commits or force-pushes
git reflog --all | head -30
```

### Step 4: Remediate
- Fix the vulnerability that allowed the exposure — for a code-level flaw, run
  the `Skill(codex-security)` patch-and-verify loop so closure is proven by
  re-scan rather than asserted
- Apply all pending security patches to affected dependencies
- Add detection rules (Semgrep/secrets scanning in CI) to catch recurrence
- Update `.gitignore` and pre-commit hooks to prevent future commits of secrets

### Step 5: Report
Document findings in this format and share with the team:

```markdown
## Security Incident Report

**Date**: [ISO timestamp]
**Severity**: [Critical / High / Medium / Low]
**Type**: [Leaked Secret / Compromised Dependency / Unauthorized Access / Data Exposure]

### What Happened
[Concise description]

### Timeline
- [timestamp]: [event]

### Blast Radius
[What systems, data, or users were potentially affected]

### Containment Actions Taken
[What was rotated, revoked, disabled]

### Root Cause
[How the exposure occurred]

### Remediation
[What was fixed and when]

### Prevention
[Controls added to prevent recurrence]
```

## OWASP Top 10 Checklist (2021)

When validating OWASP compliance, sweep each category:

| # | Category | What to Check |
|---|----------|---------------|
| A01 | Broken Access Control | Route-level auth enforcement, IDOR patterns, privilege escalation paths, missing authz on API routes |
| A02 | Cryptographic Failures | Data encrypted at rest and in transit, no deprecated algorithms (MD5, SHA1), no hardcoded keys, TLS config |
| A03 | Injection | SQL/NoSQL query construction (parameterized vs concatenated), command injection in shell calls, template injection |
| A04 | Insecure Design | Threat modeling present, security requirements defined, no business logic bypasses |
| A05 | Security Misconfiguration | Default credentials changed, unnecessary features disabled, security headers present, error messages don't leak internals |
| A06 | Vulnerable Components | Dependency audit clean, no CVEs in direct or transitive deps, components up to date |
| A07 | Auth Failures | Session management, credential stuffing protections, MFA availability, secure password storage |
| A08 | Software/Data Integrity | CI/CD pipeline integrity, dependency lock files present and committed, SBOM maintained |
| A09 | Logging/Monitoring Failures | Auth events logged, anomaly detection present, logs not containing sensitive data, alerting configured |
| A10 | SSRF | User-supplied URLs validated, outbound request allowlisting, internal metadata endpoints blocked |

```bash
# Quick security headers check
curl -I https://your-app.vercel.app 2>/dev/null | grep -i \\
  -E \"(x-frame-options|x-content-type|strict-transport|content-security|x-xss|referrer-policy)\"

# Check for SQL injection patterns
grep -rn --include=\"*.ts\" --include=\"*.js\" --exclude-dir=node_modules \\
  -E \"query\\s*\\+|query\\s*\\`[^}]*\\$\\{\" .

# Check for innerHTML/dangerouslySetInnerHTML (XSS risk)
grep -rn --include=\"*.tsx\" --include=\"*.jsx\" --include=\"*.ts\" --include=\"*.js\" \\
  -E \"(innerHTML|dangerouslySetInnerHTML)\" .
```

## Agent Ecosystem Security

When validating plugins and skills in the agent ecosystem:

```bash
# Validate plugin.json before installing
# Check: name matches directory, version is semver, tools list is not excessive
cat .claude-plugin/plugin.json | jq '{name, version, tools}'

# Flag plugins requesting dangerous tool combinations
# Warning signs: Bash + Write + no restrictions = full system access
# Warning signs: WebFetch + Bash = data exfiltration capability

# Verify SKILL.md sources
# Skills should come from known repositories (b-open-io, resend, etc.)
# Check the URL in `npx skills add <url>` before installing

# Audit agent tool access patterns
# Review agents/*.md frontmatter tools: fields
# Flag agents with broader tool access than their described role requires
grep -rn \"tools:\" agents/*.md .claude/agents/*.md 2>/dev/null | \\
  grep -v \"^Binary\" | sort
```

**Red flags in agent/plugin definitions:**
- `Bash` tool with no restrictions on a non-DevOps agent
- `Write` access for agents that should only read
- Skills from unrecognized or recently-created repositories
- Plugin install scripts that fetch remote resources at install time

## Boundary Clarity

Paul handles operational security. Route other security concerns appropriately:

- **Deep code-level security analysis** (logic bugs, auth bypass in application code) -> Jerry (code-auditor)
- **Architectural security review** (threat modeling, trust boundaries, design-level risks) -> Kayle (architecture-reviewer)
- **CI/CD security integration** (adding scanning to pipelines, securing GitHub Actions) -> Root (devops)
- **Bot fleet security** (ClawNet bot vulnerabilities, sandbox escapes) -> coordinate with Johnny (clawnet-bot:clawnet-mechanic)

