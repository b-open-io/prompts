name: Promote dev

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-dev
  cancel-in-progress: false

env:
  REVIEWER: rohenaz
  COOLING_HOURS: "24"

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge only after cooling and fresh approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base master --head dev --state open --json number --jq '.[0].number // empty')"
          [[ -n "$number" ]] || exit 0
          head_time="$(gh api "repos/$GITHUB_REPOSITORY/commits/dev" --jq '.commit.committer.date')"
          cooled="$(python3 - "$head_time" "$COOLING_HOURS" <<'PY'
          from datetime import datetime, timedelta, timezone
          import sys
          head = datetime.fromisoformat(sys.argv[1].replace('Z', '+00:00'))
          print('yes' if datetime.now(timezone.utc) - head >= timedelta(hours=int(sys.argv[2])) else 'no')
          PY
          )"
          [[ "$cooled" == "yes" ]] || exit 0
          approval="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments" --jq \
            "map(select(.user.login == \"$REVIEWER\" and .body == \"/approve\" and .created_at >= \"$head_time\")) | sort_by(.created_at) | last | .body // empty")"
          [[ "$approval" == "/approve" ]] || exit 0
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash
