name: Dual plugin validation

on:
  pull_request:
  push:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@v2

      - name: Install visual coordinator dependencies
        working-directory: tools/visual-coordinator
        run: bun install --frozen-lockfile

      - name: Run Python script tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Check Claude and Codex manifest parity
        run: python3 scripts/check-plugin-manifests.py

      - name: Check changelog and README inventory
        env:
          # Release gate: PRs compare against their base; pushes to master compare
          # against the previous master. Pushes to dev run the static checks only.
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/master' && github.event.before) || '' }}
        run: python3 scripts/check-docs.py --base "$DOCS_BASE_SHA"

      - name: Check generated Codex agents
        run: python3 scripts/codex-agents/generate.py --check

      - name: Test Codex agent installer safety
        run: python3 scripts/codex-agents/test_install.py -v

      - name: Test dual-runtime hooks
        run: bash hooks/tests/run-tests.sh

      - name: Check core source-token budget
        run: >-
          python3 scripts/plugin-weight.py
          --max-startup-tokens 3000
          --max-agent-description-chars 600
          --max-agent-examples 0
          --fail-on-duplicates

      - name: Check shipped plugin suite source-token budget
        run: >-
          python3 scripts/plugin-weight.py --all-plugins
          --max-startup-tokens 18000
          --max-agent-description-chars 600
          --max-agent-examples 0
          --fail-on-duplicates

      - name: Test OpenCode adapter
        run: bun test opencode

      - name: Check whitespace
        run: git diff --check
