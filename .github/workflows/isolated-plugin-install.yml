name: Isolated plugin install

on:
  pull_request:
  push:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  isolated-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check plugins survive marketplace extraction
        run: python3 scripts/check-plugin-extraction.py

      - name: Install pinned plugin runtimes
        run: npm install --global @anthropic-ai/claude-code@2.1.251 @openai/codex@0.150.1

      - name: Validate and install from this commit
        run: bash scripts/test-isolated-plugin-install.sh
