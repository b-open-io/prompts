name: Isolated plugin install

on:
  pull_request:
  push:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  isolated-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@v2

      - name: Install locked harness dependencies
        run: |
          bun install --cwd scripts --frozen-lockfile
          bun install --cwd tools/visual-coordinator --frozen-lockfile

      - name: Check plugins survive marketplace extraction
        run: python3 scripts/check-plugin-extraction.py

      - name: Install pinned plugin runtimes
        run: npm install --global @anthropic-ai/claude-code@2.1.251 @openai/codex@0.150.1

      - name: Validate and install from this commit
        run: bash scripts/test-isolated-plugin-install.sh

      - name: Save isolated harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-plugin-harness
          path: ${{ runner.temp }}/bopen-plugin-harness.json
          if-no-files-found: ignore
