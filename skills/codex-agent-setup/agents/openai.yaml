interface:
  display_name: "Codex Agent Setup"
  short_description: "Install core Codex custom agents (explicit only)"
  default_prompt: >-
    Use $core:codex-agent-setup to install, update, check, or uninstall core
    Codex custom agents. Explicit invocation only — never run unless the user
    asked to set up these agents.
policy:
  allow_implicit_invocation: false
